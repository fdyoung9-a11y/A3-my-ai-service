<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 여행 추천 서비스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>AI 여행 추천 서비스</h1>
    <p>가고 싶은 여행지를 입력하면 추천 문구를 보여드립니다.</p>

    <input
      type="text"
      id="destination"
      placeholder="예: 제주도, 부산, 도쿄"
    >

    <button onclick="recommendTrip()">추천 받기</button>

    <p id="result"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
