<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 여행 추천 서비스</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>AI 여행 추천 서비스</h1>
    <p class="subtitle">원하는 여행지를 입력하고 추천을 받아보세요.</p>

    <div class="tab-buttons">
      <button class="tab-btn active" onclick="openTab('intro')">서비스 소개</button>
      <button class="tab-btn" onclick="openTab('recommend')">여행 추천</button>
      <button class="tab-btn" onclick="openTab('guide')">이용 안내</button>
    </div>

    <section id="intro" class="tab-content active">
      <div class="card">
        <h2>서비스 소개</h2>
        <p>
          이 서비스는 사용자가 입력한 여행지를 바탕으로
          간단한 여행 추천 메시지를 제공하는 웹서비스입니다.
        </p>
      </div>
    </section>

    <section id="recommend" class="tab-content">
      <div class="card">
        <h2>여행 추천</h2>
        <p>가고 싶은 여행지를 입력하면 추천 메시지를 보여줍니다.</p>

        <label for="destination">여행지 입력</label>
        <input
          type="text"
          id="destination"
          placeholder="예: 제주도, 부산, 경주, 도쿄"
        />

        <button onclick="recommendTrip()">여행 추천 받기</button>

        <div id="result" class="result-box"></div>
      </div>
    </section>

    <section id="guide" class="tab-content">
      <div class="card">
        <h2>이용 안내</h2>
        <ol class="guide-list">
          <li>여행 추천 탭을 클릭합니다.</li>
          <li>원하는 여행지를 입력합니다.</li>
          <li>추천 버튼을 눌러 결과를 확인합니다.</li>
        </ol>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
