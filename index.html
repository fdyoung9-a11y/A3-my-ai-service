<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 여행 추천 서비스</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- 전체 카드 -->
    <section class="container">
      <!-- 헤더 -->
      <header class="hero">
        <h1>AI 여행 추천 서비스</h1>
        <p>원하는 여행지를 입력하고 추천을 받아보세요.</p>
      </header>

      <!-- 블록 전환 버튼 -->
      <nav class="menu" aria-label="서비스 메뉴">
        <button class="menu-btn active" data-target="intro">서비스 소개</button>
        <button class="menu-btn" data-target="recommend">여행 추천</button>
        <button class="menu-btn" data-target="guide">이용 안내</button>
      </nav>

      <!-- 공통 콘텐츠 박스 -->
      <section class="content-box">
        <!-- 소개 블록 -->
        <div class="content-panel active" id="intro">
          <h2>서비스 소개</h2>
          <p>
            이 서비스는 사용자가 입력한 여행지를 바탕으로
            간단한 여행 추천 메시지를 제공하는 웹서비스입니다.
          </p>
        </div>

        <!-- 추천 블록 -->
        <div class="content-panel" id="recommend">
          <h2>여행 추천</h2>
          <p class="panel-desc">가고 싶은 여행지를 입력하면 추천 메시지를 보여줍니다.</p>

          <label for="destination" class="input-label">여행지 입력</label>
          <input
            type="text"
            id="destination"
            class="input-box"
            placeholder="예: 제주도, 부산, 경주, 도쿄"
          />

          <button id="recommendBtn" class="action-btn">여행 추천 받기</button>

          <div id="result" class="result-box">
            아직 결과가 없습니다.
          </div>
        </div>

        <!-- 안내 블록 -->
        <div class="content-panel" id="guide">
          <h2>이용 안내</h2>
          <ol class="guide-list">
            <li>여행 추천 버튼을 클릭합니다.</li>
            <li>원하는 여행지를 입력합니다.</li>
            <li>추천 버튼을 눌러 결과를 확인합니다.</li>
          </ol>
        </div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
