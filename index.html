<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 여행 추천 서비스</title>
</head>
<body>
  <header>
    <h1>AI 여행 추천 서비스</h1>
    <p>여행 스타일, 예산, 기간을 입력하면 여행지를 추천해주는 서비스입니다.</p>
  </header>

  <main>
    <section>
      <h2>서비스 소개</h2>
      <p>사용자의 취향에 맞는 여행지를 간단하게 추천합니다.</p>
    </section>

    <section>
      <h2>여행 정보 입력</h2>
      <form>
        <label for="style">여행 스타일</label>
        <input type="text" id="style" name="style" placeholder="예: 힐링, 맛집, 액티비티">

        <br><br>

        <label for="budget">예산</label>
        <input type="text" id="budget" name="budget" placeholder="예: 50만원">

        <br><br>

        <label for="days">여행 기간</label>
        <input type="text" id="days" name="days" placeholder="예: 2박 3일">

        <br><br>

        <button type="button">추천 받기</button>
      </form>
    </section>

    <section>
      <h2>추천 결과</h2>
      <p>여기에 추천 결과가 표시됩니다.</p>
    </section>
  </main>
</body>
</html>
